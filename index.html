<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>노래방 만남의 광장</title>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@700;900&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#0b0618;font-family:'Noto Sans KR',system-ui,sans-serif;color:#fff;}
canvas{display:block;}

/* 아케이드 공통 테마 (굵은 테두리, 그림자) */
.arcade-border { border: 4px solid #000; box-shadow: 3px 3px 0 #000; border-radius: 16px; }

/* 입장 화면 (테크노 드라이브 스타일 배경) */
#join {
  position:fixed;inset:0;display:flex;flex-direction:column;gap:12px;align-items:center;justify-content:center;
  background-color: #4fc3f7;
  background-image: url("data:image/svg+xml,%3Csvg width='60' height='103.92' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M60 25.98L30 8.66L0 25.98L0 60.62L30 77.94L60 60.62Z' fill='none' stroke='%23ffffff' stroke-width='2' stroke-opacity='0.4'/%3E%3C/svg%3E");
  background-size: 60px 103.92px;
  z-index:5; color:#000;
}
#join h1 {
  background: #fff; padding: 15px 30px; font-family: 'Black Han Sans', sans-serif;
  font-size: 36px; text-shadow: none; margin: 0 0 10px; text-align: center;
  border: 5px solid #000; box-shadow: 5px 5px 0 #000; border-radius: 20px;
}
input, button { font-family: 'Noto Sans KR', inherit; padding: 12px 16px; font-size: 16px; outline: none; }
#join input { background: #fff; color: #000; width: 240px; font-weight: 900; }
#go { background: #ffeb3b; color: #000; cursor: pointer; font-weight: 900; width: 278px; font-size: 18px; }
#go:active { transform: translate(3px, 3px); box-shadow: 0 0 0 #000; }
#err { color: #d32f2f; min-height: 1em; font-weight: 900; background: #fff; padding: 0 10px; border-radius: 8px; }
#gsel { display: flex; gap: 10px; width: 278px; }
.gb { background: #eee; color: #000; width: 100%; font-weight: 900; cursor: pointer; border: 4px solid #000; box-shadow: 3px 3px 0 #000; border-radius: 12px;}
.gb.on { background: #1de9b6; box-shadow: inset 0 0 0 3px #fff, 3px 3px 0 #000; }

#top { position:fixed; top:12px; left:12px; background:#fff; color:#000; padding:6px 12px; font-size:13px; display:none; z-index:4; font-weight:900; }
#log { position:fixed; top:60px; left:12px; font-size:14px; text-shadow: -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000; font-weight:900; color:#fff; pointer-events:none; z-index:4; }

/* 메인 UI (정리된 아케이드 탭 패널) */
#ui { position:fixed; left:0; right:0; bottom:0; padding:15px; display:none; flex-direction:column; gap:10px; z-index:4; pointer-events:none; }
#arcade-dashboard { pointer-events:auto; display:flex; flex-direction:column; gap:10px; max-width: 600px; margin: 0 auto; width: 100%; }

/* 상단: 액션 버튼 그룹 (스크린샷의 알약 모양 우측 패널 느낌) */
.act-grp {
  display:none; gap:8px; flex-wrap:wrap; justify-content:center;
  background: rgba(238, 238, 238, 0.95); padding: 12px;
}
.act-grp.active { display:flex; }
.abtn {
  background: #fff; border: 3px solid #000; border-radius: 20px;
  padding: 8px 14px; font-weight: 900; color: #000; cursor: pointer;
  box-shadow: 2px 2px 0 #000; white-space: nowrap; font-size: 14px; transition: 0.1s;
}
.abtn:active { transform: translate(2px, 2px); box-shadow: 0 0 0 #000; }
.abtn.highlight { background: #ffeb3b; }

/* 하단: 카테고리 노드 (스크린샷의 좌측 세포망 디자인) */
#cat-nodes { display: flex; align-items: center; justify-content: center; gap: 8px; }
.cat-node {
  width: 55px; height: 55px; border-radius: 50%;
  background: #1de9b6; border: 4px solid #000;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 900; color: #000; cursor: pointer;
  position: relative; box-shadow: 0 3px 0 #000; line-height: 1.2;
  transition: 0.1s;
}
.cat-node.on {
  background: #b388ff; color: #fff;
  box-shadow: 0 0 0 3px #ffeb3b, 0 0 0 7px #000; /* 보라 바탕 + 노란 링 + 검은 테두리 */
  transform: scale(1.1); z-index: 2;
}

#chat { display:flex; gap:8px; width: 100%; }
#chat input { flex:1; min-width:0; background:rgba(255,255,255,0.9); }
#send { background:#ffeb3b; }

#joy{position:fixed;left:16px;bottom:250px;width:120px;height:120px;border-radius:50%;background:#ffffff1f;border:2px solid #ffffff44;display:none;touch-action:none;z-index:4}
#knob{position:absolute;left:35px;top:35px;width:50px;height:50px;border-radius:50%;background:#1de9b6;border:4px solid #000;pointer-events:none}
#flash{position:fixed;inset:0;background:#d50000;opacity:0;pointer-events:none;z-index:3}
#vig{position:fixed;inset:0;pointer-events:none;z-index:2;opacity:0;background:radial-gradient(ellipse at center,transparent 30%,#b71c1caa 100%)}
html,body{overscroll-behavior:none}
</style></head><body>

<div id="join">
  <h1>🎤 만남의 광장</h1>
  <input id="name" class="arcade-border" placeholder="닉네임 (최대 10자)" maxlength="10">
  <div id="gsel"><button class="gb on" id="gm">🧑 남자</button><button class="gb" id="gf">👩 여자</button></div>
  <input id="room" class="arcade-border" placeholder="방 코드 (친구랑 똑같이!)" maxlength="20">
  <button id="go" class="arcade-border">입 장 하 기</button>
  <div id="err"></div>
  <div style="font-size:13px; font-weight:900; text-align:center; background:rgba(255,255,255,0.8); padding:10px; border-radius:10px; border:3px solid #000;">
    PC: WASD 이동 · 마우스 시점 · 휠 줌<br>모바일: 조이스틱 이동 · 드래그 시점
  </div>
</div>

<div id="top" class="arcade-border"></div>
<div id="log"></div>
<div id="vig"></div><div id="flash"></div>
<div id="joy"><div id="knob"></div></div>

<div id="ui">
  <div id="arcade-dashboard">
    <!-- 상단: 선택된 카테고리의 버튼들 -->
    <div id="sub-actions">
      <div id="grp-basic" class="act-grp arcade-border active">
        <button id="mic" class="abtn highlight">🎤 마이크</button>
        <button id="sit" class="abtn highlight">🪑 앉기</button>
        <button id="clap" class="abtn">👏 박수</button>
        <button id="tmb" class="abtn">🪘 탬버린</button>
      </div>
      <div id="grp-motion" class="act-grp arcade-border">
        <button id="dance" class="abtn">💃 댄스</button>
        <button id="smk" class="abtn">🚬 담배</button>
      </div>
      <div id="grp-drink" class="act-grp arcade-border">
        <button id="pour" class="abtn">🥃 술따르기</button>
        <button id="drk" class="abtn">🍻 마시기</button>
        <button id="water" class="abtn">💧 물마시기</button>
      </div>
      <div id="grp-touch" class="act-grp arcade-border">
        <button id="hug" class="abtn">🫂 어깨동무</button>
        <button id="slap" class="abtn" style="color:#d32f2f">🖐️ 싸대기</button>
        <button id="burn" class="abtn" style="color:#d32f2f">🔥 담배빵</button>
      </div>
      <div id="grp-helper" class="act-grp arcade-border">
        <button id="helpf" class="abtn" style="background:#f48fb1; border-color:#880e4f">🧚 여도우미</button>
        <button id="helpm" class="abtn" style="background:#90caf9; border-color:#0d47a1">🕴️ 남도우미</button>
        <button id="bye" class="abtn" style="background:#b0bec5; border-color:#263238">🚪 퇴장</button>
      </div>
    </div>

    <!-- 하단: 둥근 노드 탭 (테크노 드라이브 스타일) -->
    <div id="cat-nodes">
      <div class="cat-node on" data-target="grp-basic">🎤<br>기본</div>
      <div class="cat-node" data-target="grp-motion">💃<br>모션</div>
      <div class="cat-node" data-target="grp-drink">🍻<br>음주</div>
      <div class="cat-node" data-target="grp-touch">👊<br>터치</div>
      <div class="cat-node" data-target="grp-helper">🧚<br>도우미</div>
    </div>

    <div id="chat">
      <input id="msg" class="arcade-border" placeholder="채팅을 입력하세요..." maxlength="120">
      <button id="send" class="abtn">전송</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script src="/socket.io/socket.io.js"></script>
<script>
// UI 탭 전환 스크립트 추가
document.querySelectorAll('.cat-node').forEach(node => {
  node.onclick = () => {
    document.querySelectorAll('.cat-node').forEach(x => x.classList.remove('on'));
    document.querySelectorAll('.act-grp').forEach(x => x.classList.remove('active'));
    node.classList.add('on');
    document.getElementById(node.dataset.target).classList.add('active');
  };
});

const $=id=>document.getElementById(id),clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),rnd=(a,b)=>a+Math.random()*(b-a);
const COLORS=[0xff5252,0x40c4ff,0x69f0ae,0xffd740,0xe040fb,0xff9100];
const HAIRS=[0x3e2316,0x151515,0x5d4037,0x8d6e63,0x212121,0x4e342e];
const socket=io();
let me,roomName,gender='m',players={},helpers={},micId=null,keys={},scene,camera,renderer,spot,ball,lights=[],clock,screenTimer,sendT=0,dirty=0,door,doorT=0,composer;
const sc=document.createElement('canvas');sc.width=512;sc.height=256;
const sx=sc.getContext('2d'),stex=new THREE.CanvasTexture(sc);

const gltfLoader = new THREE.GLTFLoader();
function loadModel(url, x, y, z, scale = 1, rotY = 0) {
  gltfLoader.load(url, (gltf) => {
    const model = gltf.scene;
    model.position.set(x, y, z);
    model.scale.set(scale, scale, scale);
    model.rotation.y = rotY;
    model.traverse((child) => {
      if (child.isMesh) {
        child.castShadow = true;
        child.receiveShadow = true;
      }
    });
    scene.add(model);
  }, undefined, (error) => {
    console.error('모델 로드 에러:', error);
  });
}

// 앉을 수 있는 자리: 의자 4개 + 소파 8자리
const SEATS=[];
[[-2.2,-3.6],[-1.5,-3.6],[1.5,-3.6],[2.2,-3.6]].forEach(([x,z])=>SEATS.push({x,z,ry:0,y:.46,sx:x,sz:z+.95}));
[-1.8,0,1.8,3.6].forEach(z=>{SEATS.push({x:-3.15,z,ry:Math.PI/2,y:.5,sx:-1.8,sz:z});SEATS.push({x:3.15,z,ry:-Math.PI/2,y:.5,sx:1.8,sz:z})});
const HSP=[-1.8,-.6,.6,1.8]; // 도우미 대기 위치 x (z=3.9)
const DOOR_X=-3,DOOR_Z=-5.4;

$('room').value=new URLSearchParams(location.search).get('room')||'';
$('gm').onclick=()=>{gender='m';$('gm').classList.add('on');$('gf').classList.remove('on')};
$('gf').onclick=()=>{gender='f';$('gf').classList.add('on');$('gm').classList.remove('on')};
$('go').onclick=()=>{roomName=$('room').value.trim()||'노래방';socket.emit('join',{name:$('name').value.trim()||'익명',room:roomName,gender})};
socket.on('full',()=>$('err').textContent='방이 꽉 찼어요! (최대 6명)');
socket.on('notice',t=>addLog('📢',t));

function label(text,bg){
  const c=document.createElement('canvas');c.width=512;c.height=96;
  const x=c.getContext('2d');x.font='bold 40px sans-serif';
  const t=text.length>22?text.slice(0,22)+'…':text;
  if(bg){const w=Math.min(500,x.measureText(t).width+40);x.fillStyle=bg;x.beginPath();x.roundRect((512-w)/2,10,w,76,24);x.fill()}
  x.textAlign='center';x.textBaseline='middle';
  if(!bg){x.lineWidth=7;x.strokeStyle='#000';x.strokeText(t,256,48)}
  x.fillStyle='#fff';x.fillText(t,256,48);
  const s=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),transparent:true,depthTest:false}));
  s.scale.set(3.2,.6,1);return s;
}
function showScreen(l1,l2,hue,secs){
  sx.fillStyle=`hsl(${hue},60%,16%)`;sx.fillRect(0,0,512,256);
  sx.fillStyle='#fff';sx.textAlign='center';sx.font='bold 40px sans-serif';sx.fillText(l1,256,105);
  sx.font='bold 66px sans-serif';sx.fillText(l2,256,200);stex.needsUpdate=true;
  clearTimeout(screenTimer);screenTimer=null;
  if(secs)screenTimer=setTimeout(()=>{screenTimer=null;setMic(micId)},secs*1000);
}
function setMic(id){
  micId=id;$('mic').innerHTML=id===me?'🎤 마이크 내려놓기':'🎤 마이크';
  if(id&&players[id])showScreen(players[id].name+' 열창중','♪ ♫ ♪',300,0);
  else if(!screenTimer)showScreen('🎤 노래방','마이크를 잡아봐!',280,0);
}
function addLog(n,t){const d=document.createElement('div');d.textContent=n+': '+t;const l=$('log');l.appendChild(d);while(l.children.length>6)l.firstChild.remove()}
function updateTop(){const L=players[me];$('top').textContent='방 코드: '+roomName+' · '+Object.keys(players).length+'/6명'+(L&&L.drunk>0?' · 🍺 취기 '+L.drunk+'/8':'')}
function bubble(p,text,secs){if(p.bub)p.g.remove(p.bub);p.bub=label(text,'#000a');p.bub.position.y=2.6;p.g.add(p.bub);p.bt=secs}

const SKIN=0xf1c9a5,RED=new THREE.Color(0xe53935);
const mat=(c,o)=>new THREE.MeshStandardMaterial(Object.assign({color:c,flatShading:true},o));
const bx=(w,h,d,c,x,y,z,o)=>{const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(c,o));m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;return m};
const cy=(r1,r2,h,c,x,y,z,o,seg)=>{const m=new THREE.Mesh(new THREE.CylinderGeometry(r1,r2,h,seg||8),mat(c,o));m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;return m};
const sp=(r,c,x,y,z)=>{const m=new THREE.Mesh(new THREE.SphereGeometry(r,8,6),mat(c));m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;return m};
const cap=(r,c,x,y,z)=>{const m=new THREE.Mesh(new THREE.SphereGeometry(r,8,6,0,Math.PI*2,0,Math.PI/2),mat(c));m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;return m};
function limb(x,y,mesh,off){const g=new THREE.Group();g.position.set(x,y,0);mesh.position.set(0,off,0);g.add(mesh);return g}

// 캐릭터 공통 제작: o.f=여자 / 남자는 사무직(셔츠+넥타이) 또는 정장(도우미)
function body(o){
  const F=o.f,g=new THREE.Group(),E=o.em||{};let legL,legR,armL,armR,head,al;
  if(F){
    legL=limb(-.07,.62,cy(.05,.04,.6,SKIN,0,0,0),-.3);legR=limb(.07,.62,cy(.05,.04,.6,SKIN,0,0,0),-.3);
    [legL,legR].forEach(l=>{l.add(bx(.08,.07,.18,0xc62828,0,-.58,.04))});
    armL=limb(-.22,1.05,cy(.035,.03,.45,SKIN,0,0,0),-.22);armR=limb(.22,1.05,cy(.035,.03,.45,SKIN,0,0,0),-.22);
    al=.45;head=sp(.17,SKIN,0,1.4,0);
    g.add(cy(.15,.19,.42,o.dress,0,.88,0,E),cy(.19,.3,.22,o.dress,0,.7,0,E),head,cap(.19,o.hair,0,1.42,0),bx(.38,.75,.1,o.hair,0,1.05,-.12),
      bx(.035,.05,.02,0x222222,-.06,1.42,.16),bx(.035,.05,.02,0x222222,.06,1.42,.16),bx(.06,.03,.02,0xff1744,0,1.34,.17));
    if(o.helper)g.add(sp(.025,0xffd740,-.17,1.3,0),sp(.025,0xffd740,.17,1.3,0));
  }else{
    legL=limb(-.1,.58,bx(.17,.58,.2,o.pants,0,0,0),-.29);legR=limb(.1,.58,bx(.17,.58,.2,o.pants,0,0,0),-.29);
    [legL,legR].forEach(l=>l.add(bx(.19,.08,.3,0x111111,0,-.58,.05)));
    armL=limb(-.33,1.12,bx(.12,.5,.14,o.sleeve,0,0,0),-.24);armR=limb(.33,1.12,bx(.12,.5,.14,o.sleeve,0,0,0),-.24);
    [armL,armR].forEach(a=>a.add(sp(.07,SKIN,0,-.54,0)));
    al=.5;head=sp(.2,SKIN,0,1.45,0);
    g.add(bx(.52,.62,.3,o.shirt,0,.88,0),head,cap(.22,o.hair,0,1.47,-.01));
    if(o.suit){
      g.add(bx(.16,.5,.02,0xffffff,0,.9,.16),bx(.14,.06,.02,0xd50000,0,1.14,.17),
        bx(.04,.05,.02,0x222222,-.07,1.47,.19),bx(.04,.05,.02,0x222222,.07,1.47,.19));
    }else{
      g.add(bx(.08,.42,.02,o.tie,0,.9,.16),bx(.03,.34,.02,0x1565c0,.12,.98,.16),bx(.12,.16,.02,0x90caf9,.12,.76,.16),bx(.34,.05,.02,0x222222,0,1.46,.19));
    }
  }
  const mk=(...ms)=>{const h=new THREE.Group();ms.forEach(m=>{m.rotation.x=Math.PI/2;h.add(m)});h.position.set(0,-(al+.06),0);h.visible=false;return h};
  const glassM=(c,e)=>mk(cy(.045,.035,.09,0xb3e5fc,0,0,0,{transparent:true,opacity:.6}),cy(.034,.034,.05,c,0,0,0,{emissive:e}));
  const cig=mk(bx(.025,.13,.025,0xffffff,0,0,0),bx(.027,.03,.027,0xff6d00,0,-.08,0,{emissive:0xff3d00}));
  const bottle=mk(cy(.05,.05,.2,0x8d4a14,0,0,0,{emissive:0x2a1204}),cy(.025,.025,.1,0x8d4a14,0,.15,0,{emissive:0x2a1204}));
  const glass=glassM(0xff9800,0x553300),glassL=glassM(0xff9800,0x553300),wglass=glassM(0x4fc3f7,0x0d3a52);
  // 담배빵용: 팔 방향(앞)으로 뻗는 담배
  const bcig=new THREE.Group();bcig.add(bx(.028,.14,.028,0xffffff,0,0,0),bx(.03,.035,.03,0xff6d00,0,-.085,0,{emissive:0xff3d00}));
  bcig.position.set(0,-(al+.1),0);bcig.visible=false;
  armR.add(cig,glass,wglass,bottle,bcig);armL.add(glassL);
  const r={g,legL,legR,armL,armR,head,cig,glass,wglass,bottle,glassL,bcig};
  if(o.helper&&F){ // 탬버린
    const tb=new THREE.Mesh(new THREE.TorusGeometry(.17,.035,6,12),mat(0xffd740,{emissive:0x554400}));tb.position.set(0,-.58,0);armR.add(tb);r.tb=tb;
  }
  g.add(legL,legR,armL,armR);
  return r;
}
function makePlayerBody(p){
  return p.gender==='f'
    ?body({f:1,dress:COLORS[p.color%6],hair:HAIRS[p.color%6]})
    :body({f:0,pants:0x2b2f3a,sleeve:0xf5f5f5,shirt:0xf5f5f5,hair:0x1b1b1f,tie:COLORS[p.color%6]});
}
function add(p){

  box(.1,2.2,.12,0x3e2723,DOOR_X-.55,1.1,-5.44);box(.1,2.2,.12,0x3e2723,DOOR_X+.55,1.1,-5.44);box(1.2,.1,.12,0x3e2723,DOOR_X,2.15,-5.44);
  door=new THREE.Group();door.position.set(DOOR_X-.5,0,-5.42);scene.add(door);
  door.add(bx(1,2.1,.06,0x6d4c41,.5,1.05,0),bx(.7,.8,.02,0x5d4037,.5,1.5,.04),bx(.7,.7,.02,0x5d4037,.5,.6,.04),sp(.04,0xffd740,.85,1.0,.06));
  plaque(1.1,.28,(c,w,h)=>{c.fillStyle='#1b5e20';c.fillRect(0,0,w,h);c.fillStyle='#fff';c.font='bold '+h*.6+'px sans-serif';c.textAlign='center';c.fillText('🚪 입구',w/2,h*.72)},DOOR_X,2.45,-5.44,0);
  
  // 조명: 미러볼, 회전 조명, 벽에 번지는 디스코 점, 초록 레이저
  ball=A(new THREE.Mesh(new THREE.IcosahedronGeometry(.45,1),mat(0xdddddd,{metalness:.9,roughness:.2})));ball.position.set(0,3.5,-3);
  [0xff00ff,0x00e5ff,0xffee00].forEach(c=>{
    const l=new THREE.PointLight(c,1.1,9);
    l.castShadow = true;
    scene.add(l);lights.push(l)
  });
  
  // 2. 스팟라이트 그림자 활성화
  spot=new THREE.SpotLight(0xffffff,0,12,.4,.5);
  spot.position.set(0,3.9,-4.1);
  spot.castShadow = true;
  spot.shadow.mapSize.width = 1024;
  spot.shadow.mapSize.height = 1024;
  scene.add(spot,spot.target);
  
  laser=A(new THREE.Mesh(new THREE.TorusGeometry(.8,.04,6,20),new THREE.MeshBasicMaterial({color:0x00ff66,wireframe:true})));
  laser.position.set(3.9,2.5,-3.3);laser.rotation.y=-Math.PI/2;
  const dg=new THREE.CircleGeometry(1,10),rot=[Math.PI/2,-Math.PI/2,0,Math.PI];
  for(let i=0;i<64;i++){
    const w=i%5,m=new THREE.Mesh(dg,new THREE.MeshBasicMaterial({color:DOT[i%6],transparent:true,opacity:.75,depthWrite:false})),s=rnd(.15,.38);
    m.scale.set(s,s,1);if(w<4)m.rotation.y=rot[w];else m.rotation.x=-Math.PI/2;scene.add(m);
    dots.push({m,w,u:rnd(-4,4),v:w===4?rnd(-5,5):rnd(.5,3.6),s:rnd(.3,.9),p:rnd(0,6.3)});
  }
  
  // 3. EffectComposer 세팅 (Bloom 패스 추가)
  const renderScene = new THREE.RenderPass(scene, camera);
  const bloomPass = new THREE.UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 1.2, 0.5, 0.4);
  bloomPass.strength = 0.8; // 네온, 화면 빛 번짐 강도 조절
  
  composer = new THREE.EffectComposer(renderer);
  composer.addPass(renderScene);
  composer.addPass(bloomPass);
}

let lastFilter='';
function tick(){
  requestAnimationFrame(tick);
  const dt=Math.min(clock.getDelta(),.1),t=clock.elapsedTime,L=players[me];
  let ix=(keys.d?1:0)-(keys.a?1:0)+jv.x,iy=(keys.w?1:0)-(keys.s?1:0)-jv.y;
  const mag=Math.hypot(ix,iy),moving=mag>.15;
  if(L&&moving){
    if(L.seat!=null)standUp(L,true); // 움직이면 자동으로 일어남
    if(L.at>0&&(L.act==='dance'||L.act==='hug')){L.at=0;socket.emit('emote',{type:'stop'})}
    if(mag>1){ix/=mag;iy/=mag}
    const spd=Math.min(1,mag),cs=Math.cos(yaw),sn=Math.sin(yaw);
    let dx=ix*cs-iy*sn,dz=-ix*sn-iy*cs;const g=L.g;
    if(L.dv>=3.5){const a=Math.sin(t*2.1)*L.dv*.07,c=Math.cos(a),s=Math.sin(a);const ex=dx*c-dz*s;dz=dx*s+dz*c;dx=ex} // 취하면 비틀비틀
    const nx=clamp(g.position.x+dx*3.2*spd*dt,-3.6,3.6),nz=clamp(g.position.z+dz*3.2*spd*dt,-5.2,5.2);
    if(!blocked(nx,g.position.z))g.position.x=nx;
    if(!blocked(g.position.x,nz))g.position.z=nz;
    g.rotation.y=Math.atan2(dx,dz);dirty=1;
  }
  // 어깨동무 중이면 상대를 따라다님
  if(L&&L.at>0&&L.act==='hug'){
    const tg=players[L.tgt];
    if(!tg)L.at=0;
    else{const r=tg.g.rotation.y;L.g.position.x=tg.g.position.x+.5*Math.cos(r);L.g.position.z=tg.g.position.z-.5*Math.sin(r);L.g.rotation.y=r;dirty=1}
  }
  sendT+=dt;
  if(L&&dirty&&sendT>.06){sendT=0;if(!moving&&!(L.at>0&&L.act==='hug'))dirty=0;socket.emit('move',{x:L.g.position.x,z:L.g.position.z,ry:L.g.rotation.y})}
  const hugger=id=>{for(const k in players){const q=players[k];if(q.at>0&&q.act==='hug'&&q.tgt===id)return q}return null};
  for(const id in players){
    const p=players[id],g=p.g;let w=moving&&id===me;
    if(id!==me){const k=Math.min(1,dt*10),ex=p.tx-g.position.x,ez=p.tz-g.position.z;
      g.position.x+=ex*k;g.position.z+=ez*k;g.rotation.y=p.tr;w=Math.hypot(ex,ez)>.05}
    const sit=p.seat!=null;
    p.dv+=(p.drunk-p.dv)*Math.min(1,dt*.7);
    p.head.material.color.setHex(SKIN).lerp(RED,Math.min(.75,p.dv/7)); // 취하면 얼굴이 빨개짐
    const s=(w&&!sit)?Math.sin(t*10)*.7:0;
    p.bounce=Math.max(0,p.bounce-dt);
    if(p.at>0)p.at-=dt;
    if(p.hit>0)p.hit-=dt;
    const a=p.at>0?p.act:'';
    p.cig.visible=a==='smoke';p.glass.visible=a==='drink';p.wglass.visible=a==='water';
    p.bottle.visible=p.glassL.visible=a==='pour';p.bcig.visible=a==='burn';
    let y=sit?SEATS[p.seat].y-.5:0,sw=Math.sin(t*1.7+p.ph)*p.dv*.014;
    let lL=sit?-1.5:s,lR=sit?-1.5:-s;
    let aLx=sit?-.5:-s*.8,aLz=0,aRx=sit?-.5:s*.8,aRz=0;
    if(p.bounce>0){aLx=aRx=0;aLz=-2.4;aRz=2.4;y+=Math.abs(Math.sin(t*14))*.25}
    else if(a==='pour'){aLx=-1.5;aLz=.5;aRx=-1.5;aRz=-.5}
    else if(a==='smoke'||a==='drink'||a==='water'){aLx=0;aRx=-2.5+Math.sin(t*(a==='smoke'?1.5:6))*.12;
      if(a==='smoke'){p.pt-=dt;if(p.pt<=0){p.pt=.2;p.cig.getWorldPosition(tmpV);puff(tmpV)}}}
    else if(a==='dance'){
      const m=Math.floor(t/1.6)%3,k=Math.sin(t*8);
      y+=Math.abs(k)*.1;sw+=Math.sin(t*4)*.12;lL=k*.6;lR=-k*.6;
      if(m===0){aLx=aRx=0;aLz=-2.5+k*.5;aRz=2.5-k*.5}
      else if(m===1){aRx=0;aRz=2.6+k*.3;aLx=k*.8;aLz=-.2}
      else{aLx=-1.2+k*.8;aRx=-1.2-k*.8}
    }
    else if(a==='hug'){aLx=0;aLz=-1.35}
    else if(a==='slap'||a==='burn'){
      const tp=players[p.tgt];
      if(tp){const q=tp.g.position;g.rotation.y=Math.atan2(q.x-g.position.x,q.z-g.position.z)}
      if(a==='slap'){
        const u=(.9-p.at)/.9;aLx=0;
        if(u<.35){const k=u/.35;aRx=-2.6*k;aRz=.5*k}
        else if(u<.55){const k=(u-.35)/.2;aRx=-2.6+1.4*k;aRz=.5-.8*k}
        else{const k=Math.min(1,(u-.55)/.45);aRx=-1.2*(1-k);aRz=-.3*(1-k)}
        if(u>=.45&&!p.fx){p.fx=1;impact(p,'slap')}
      }else{
        const u=(1.6-p.at)/1.6;aLx=0;
        aRx=-1.5*(u<.7?Math.min(1,u/.35):Math.max(0,1-(u-.7)/.3));
        if(u>=.5&&!p.fx){p.fx=1;impact(p,'burn')}
      }
    }
    const hb=hugger(id);
    if(hb&&!a&&p.bounce<=0){aRx=0;aRz=1.35} // 어깨동무 받는 쪽도 팔을 올림
    if(p.hit>0){
      if(p.hitType==='slap')sw+=Math.sin(p.hit*22)*p.hit*.5;
      else{y+=Math.sin(p.hit/.7*Math.PI)*.3;aRx=-1+Math.sin(t*35)*.5;aRz=0}
    }
    p.legL.rotation.x=lL;p.legR.rotation.x=lR;
    p.armL.rotation.set(aLx,0,aLz);p.armR.rotation.set(aRx,0,aRz);
    g.position.y=y;g.rotation.z=sw;
    if(p.bub){p.bt-=dt;if(p.bt<=0){g.remove(p.bub);p.bub=null}}
  }
  // 카메라 + 취했을 때 어지러운 화면
  const dvL=L?L.dv:0;
  if(L){const p=L.g.position,cp=Math.cos(pitch);
    tmpC.set(clamp(p.x+Math.sin(yaw)*cp*dist,-3.7,3.7),clamp(.9+Math.sin(pitch)*dist,.5,4),clamp(p.z+Math.cos(yaw)*cp*dist,-5.2,5.2));
    camera.position.lerp(tmpC,Math.min(1,dt*10));camera.lookAt(p.x,.9,p.z);
    if(dvL>.2){camera.rotateZ(Math.sin(t*1.3)*dvL*.012);camera.fov=65+Math.sin(t*1.1)*dvL*.9;camera.updateProjectionMatrix()}
    else if(camera.fov!==65){camera.fov=65;camera.updateProjectionMatrix()}}
  const fl=dvL>=2?'blur('+((dvL-1.5)*.35).toFixed(2)+'px) saturate('+(1+dvL*.08).toFixed(2)+') hue-rotate('+(Math.sin(t*.7)*dvL*3).toFixed(1)+'deg)':'';
  if(fl!==lastFilter){renderer.domElement.style.filter=fl;lastFilter=fl}
  $('vig').style.opacity=dvL>=2?Math.min(1,dvL/8)*(.7+Math.sin(t*1.5)*.3):0;
  const holder=micId&&players[micId];
  if(holder){const p=holder.g.position;spot.intensity=2.5;spot.position.set(p.x,3.9,p.z+.01);spot.target.position.copy(p)}
  else spot.intensity=0;
  ball.rotation.y+=dt*.8;laser.rotation.z+=dt*.8;
  lights.forEach((l,i)=>l.position.set(Math.cos(t*.8+i*2.1)*3,3.2,Math.sin(t*.8+i*2.1)*4-1));
  dots.forEach(d=>placeDot(d,t));
  // 도우미: 문으로 들어와서 자리에 서고, 퇴장 요청 전까지 계속 있음
  for(const id in helpers){
    const h=helpers[id],g=h.g;let walking=false;
    if(h.delay>0){h.delay-=dt;doorT=Math.max(doorT,1.2);if(h.delay<=0)g.visible=true;continue}
    if(h.wp.length){
      const [wx,wz]=h.wp[0],dx=wx-g.position.x,dz=wz-g.position.z,d=Math.hypot(dx,dz),st=1.7*dt;
      walking=true;
      if(d<=st){g.position.x=wx;g.position.z=wz;h.wp.shift()}
      else{g.position.x+=dx/d*st;g.position.z+=dz/d*st;g.rotation.y=Math.atan2(dx,dz)}
      if(!h.wp.length){
        if(h.state==='out'){scene.remove(g);delete helpers[id];doorT=Math.max(doorT,.8);continue}
        h.state='idle';g.rotation.y=Math.PI;walking=false;
      }
    }
    if(Math.hypot(g.position.x-DOOR_X,g.position.z-DOOR_Z)<3.2)doorT=Math.max(doorT,.5);
    const s=walking?Math.sin(t*10)*.7:0;
    h.legL.rotation.x=s;h.legR.rotation.x=-s;
    if(walking){h.armL.rotation.set(-s*.8,0,h.gender==='f'?-.25:0);h.armR.rotation.set(s*.8,0,h.gender==='f'?2.4:0);g.position.y=0}
    else if(h.gender==='f'){
      g.position.y=Math.abs(Math.sin(t*6+h.ph))*.08;g.rotation.y=Math.PI+Math.sin(t*3+h.ph)*.35;
      h.armL.rotation.set(0,0,-.25);h.armR.rotation.set(0,0,2.4+Math.sin(t*14)*.25);h.tb.rotation.z=Math.sin(t*20)*.5;
    }else{
      g.position.y=Math.abs(Math.sin(t*5+h.ph))*.06;g.rotation.y=Math.PI+Math.sin(t*2.5+h.ph)*.3;
      h.armL.rotation.set(Math.sin(t*5+h.ph)*.5,0,-.15);h.armR.rotation.set(-1.2+Math.sin(t*5+h.ph)*.5,0,.1);
    }
    if(h.bub){h.bt-=dt;if(h.bt<=0){g.remove(h.bub);h.bub=null}}
  }
  doorT=Math.max(0,doorT-dt);
  door.rotation.y+=((doorT>0?-1.75:0)-door.rotation.y)*Math.min(1,dt*5);
  for(let i=puffs.length-1;i>=0;i--){const u=puffs[i];u.t+=dt;u.m.position.y+=dt*.5;u.m.position.x+=dt*.05;
    const k=1+u.t*2;u.m.scale.set(k,k,k);u.m.material.opacity=Math.max(0,.55-u.t*.28);
    if(u.t>2){scene.remove(u.m);u.m.material.dispose();puffs.splice(i,1)}}
  for(let i=parts.length-1;i>=0;i--){const u=parts[i];u.t+=dt;u.vy-=u.g*dt;
    u.m.position.x+=u.vx*dt;u.m.position.y=Math.max(.02,u.m.position.y+u.vy*dt);u.m.position.z+=u.vz*dt;
    u.m.material.opacity=Math.max(0,1-u.t/u.life);
    if(u.t>u.life){scene.remove(u.m);u.m.material.dispose();parts.splice(i,1)}}
  
  // 4. 기존 renderer 대신 composer로 렌더링
  if(composer) composer.render();
  else renderer.render(scene,camera);
}
</script></body></html>
