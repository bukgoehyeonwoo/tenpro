<style>
/* 1. 깔끔한 UI/UX로 디자인 전면 개편 */
@font-face{font-family:'Pretendard Variable';font-weight:45 920;font-style:normal;font-display:swap;src:url('/fonts/PretendardVariable.woff2') format('woff2-variations'),url('/fonts/PretendardVariable.woff2') format('woff2')}
html,body{margin:0;height:100%;overflow:hidden;background:#0b0618;font-family:'Pretendard Variable',Pretendard,system-ui,sans-serif;color:#333;}
canvas{display:block;}

.clean-box { 
  background: rgba(255, 255, 255, 0.85); 
  backdrop-filter: blur(12px); 
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid rgba(255, 255, 255, 0.3); 
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15); 
  border-radius: 16px; 
}

#join {
  position:fixed;inset:0;display:flex;flex-direction:column;gap:16px;align-items:center;justify-content:center;
  background: linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%);
  z-index:5;
}
#join h1 {
  background: rgba(255,255,255,0.9); padding: 15px 35px; font-family: 'Pretendard Variable',Pretendard,sans-serif; font-weight: 700;

  border-radius: 24px; box-shadow: 0 10px 20px rgba(0,0,0,0.1);
}
input, button { font-family: 'Pretendard Variable',Pretendard,sans-serif; padding: 14px 18px; font-size: 16px; outline: none; border:none; transition: 0.2s ease; }
#join input { width: 240px; font-weight: 500; color: #333; }
#join input::placeholder { color: #aaa; }
#go { background: #3b82f6; color: #fff; cursor: pointer; font-weight: 600; width: 278px; font-size: 18px; letter-spacing: 1px; }
#go:hover { background: #2563eb; transform: translateY(-2px); }
#go:active { transform: translateY(1px); }
#err { color: #ef4444; min-height: 1em; font-weight: 500; background: rgba(255,255,255,0.9); padding: 5px 12px; border-radius: 8px; font-size: 14px;}
#gsel { display: flex; gap: 10px; width: 278px; }
.gb { background: rgba(255,255,255,0.6); color: #555; width: 100%; font-weight: 600; cursor: pointer; border-radius: 12px; border: 2px solid transparent;}
.gb.on { background: #fff; color: #3b82f6; border-color: #3b82f6; box-shadow: 0 4px 12px rgba(59, 130, 246, 0.2); }

#top { position:fixed; top:16px; left:16px; color:#333; padding:10px 16px; font-size:14px; display:none; z-index:4; font-weight:500; }

#ui { position:fixed; left:0; right:0; bottom:0; padding:15px; display:none; flex-direction:column; gap:12px; z-index:4; pointer-events:none; }
#arcade-dashboard { pointer-events:auto; display:flex; flex-direction:column; gap:12px; max-width: 600px; margin: 0 auto; width: 100%; }

.act-grp {
  display:none; gap:10px; flex-wrap:wrap; justify-content:center;
  padding: 16px;
}
.act-grp.active { display:flex; }
.abtn {
  background: #fff; border-radius: 20px;
  padding: 10px 16px; font-weight: 500; color: #333; cursor: pointer;
  box-shadow: 0 2px 6px rgba(0,0,0,0.06); white-space: nowrap; font-size: 14px; 
  border: 1px solid #eaeaea;
}
.abtn:active { transform: scale(0.95); }
.abtn.highlight { background: #eff6ff; color: #1d4ed8; border-color: #bfdbfe; }

#cat-nodes { display: flex; align-items: center; justify-content: center; gap: 10px; }
.cat-node {
  width: auto; padding: 10px 16px; border-radius: 24px;
  background: rgba(255,255,255,0.7); backdrop-filter: blur(5px);
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; font-weight: 600; color: #555; cursor: pointer;
  box-shadow: 0 2px 8px rgba(0,0,0,0.05); transition: 0.2s; border: 1px solid rgba(255,255,255,0.5);
}
.cat-node.on {
  background: #3b82f6; color: #fff; border-color: #3b82f6;
  box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4); transform: translateY(-2px);
}

#chat { display:flex; gap:10px; width: 100%; }
#chat input { flex:1; min-width:0; background:rgba(255,255,255,0.9); border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); border: 1px solid #ddd; }
#send { background:#3b82f6; color:#fff; border-radius: 12px; font-weight:600; }
#send:hover { background:#2563eb; }

#joy{position:fixed;left:16px;bottom:250px;width:120px;height:120px;border-radius:50%;background:#ffffff1f;border:2px solid #ffffff44;display:none;touch-action:none;z-index:4}
#knob{position:absolute;left:35px;top:35px;width:50px;height:50px;border-radius:50%;background:#fff;box-shadow:0 4px 10px rgba(0,0,0,0.2);pointer-events:none}
#flash{position:fixed;inset:0;background:#d50000;opacity:0;pointer-events:none;z-index:3}
#vig{position:fixed;inset:0;pointer-events:none;z-index:2;opacity:0;background:radial-gradient(ellipse at center,transparent 30%,#b71c1caa 100%)}
html,body{overscroll-behavior:none}
/* ===== 컴팩트 + 켜고 끄는(토글) UI ===== */
#ui{padding:10px 70px 10px 10px;gap:8px}
#ui>*{pointer-events:auto}
#arcade-dashboard{max-width:560px;gap:6px}
body:not(.menu-on) #arcade-dashboard{display:none}
body:not(.chat-on) #chat{display:none}
#chat{max-width:560px;width:100%;margin:0 auto}
.act-grp{padding:8px 10px;gap:6px;background:rgba(255,255,255,.72)}
.abtn{padding:8px 12px;font-size:13px}
.cat-node{padding:6px 11px;font-size:12px}
#cat-nodes{gap:6px;justify-content:flex-start;overflow-x:auto}
#fab{position:fixed;right:10px;bottom:10px;display:flex;flex-direction:column;gap:8px;z-index:6}
.fab{width:46px;height:46px;padding:0;border-radius:50%;font-size:21px;cursor:pointer;background:rgba(255,255,255,.88);box-shadow:0 4px 14px rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.6)}
.fab.on{background:#3b82f6}
.fab svg{display:block;margin:auto;stroke:#333}
.fab.on svg{stroke:#fff}
#joy{bottom:24px}
body.menu-on #joy{bottom:150px}
@media(pointer:coarse){.act-grp{flex-wrap:nowrap;overflow-x:auto;justify-content:flex-start}.abtn,.cat-node{flex:0 0 auto}}

/* ===== 열창 표시 / 점수 / 알림 UI ===== */
#singer{position:fixed;top:16px;right:16px;display:none;align-items:center;gap:10px;padding:10px 16px;font-size:14px;font-weight:500;color:#333;z-index:4}
#singer.on{display:flex}
.eq{display:inline-flex;gap:3px;align-items:flex-end;height:16px}
.eq i{width:3px;height:4px;background:#3b82f6;border-radius:2px;animation:eq .9s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:.2s}.eq i:nth-child(3){animation-delay:.4s}.eq i:nth-child(4){animation-delay:.1s}
@keyframes eq{0%,100%{height:4px}50%{height:16px}}
#score{position:fixed;top:84px;left:50%;transform:translate(-50%,-10px);opacity:0;pointer-events:none;text-align:center;padding:14px 28px;z-index:4;transition:opacity .4s,transform .4s}
#score.on{opacity:1;transform:translate(-50%,0)}
#scoreName{font-size:13px;font-weight:500;color:#666}
#scoreNum{font-size:34px;font-weight:600;color:#1d4ed8;margin-top:2px}
#toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:rgba(20,20,30,.85);color:#fff;padding:8px 16px;border-radius:12px;font-size:13px;font-weight:500;opacity:0;pointer-events:none;transition:opacity .3s;z-index:7;white-space:nowrap}
#toast.on{opacity:1}

/* ===== 유흥비 HUD ===== */
#bill{position:fixed;top:16px;right:16px;display:none;z-index:4;padding:10px 16px;text-align:right;cursor:pointer;min-width:160px}
#bill .bl{font-size:11px;letter-spacing:3px;color:#b39ddb}
#billMe{font-size:25px;font-weight:700;color:#ffd166;font-variant-numeric:tabular-nums;text-shadow:0 0 12px #ffb30044}
#billRoom{font-size:11px;color:#9a8fb8;font-variant-numeric:tabular-nums}

#bill.open #rcpt{display:block}

#singer{top:100px!important}

#order{position:fixed;left:50%;bottom:68px;transform:translateX(-50%);width:min(520px,94vw);display:none;z-index:6;padding:12px;max-height:55vh;overflow:auto}

.oi button{background:#a8741a;color:#fff;border-radius:14px;padding:7px 16px;font-size:13px;font-weight:600;cursor:pointer}
.oi button:active{transform:scale(.95)}

function label(text,bg){
  const c=document.createElement('canvas');c.width=512;c.height=96;
  const x=c.getContext('2d');x.font='600 40px '+FONT;
  const t=text.length>22?text.slice(0,22)+'…':text;
  if(bg){const w=Math.min(500,x.measureText(t).width+40);x.fillStyle=bg;x.beginPath();x.roundRect((512-w)/2,10,w,76,24);x.fill()}
  x.textAlign='center';x.textBaseline='middle';
  if(!bg){x.lineWidth=7;x.strokeStyle='#000';x.strokeText(t,256,48)}
  x.fillStyle='#fff';x.fillText(t,256,48);
  const s=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),transparent:true,depthTest:false}));
  s.scale.set(3.2,.6,1);return s;
}

  if(T==='stop'){p.at=0;p.bounce=0;return}
  if(T==='clap'||T==='tmb'){p.bounce=2;return}
  const D={smoke:11,pour:4,recv:4,cash:4.5,drink:3,water:3,dance:8,hug:7,slap:.9,burn:1.6}[T];
  if(!D)return;
  p.act=T;p.at=D;p.pt=0;p.fx=0;p.tgt=m.target||null;if(T==='cash')p.rng=mulberry32(m.seed||1);
  if(m.target){
    const tg=players[m.target]||helpers[m.target];
    if(tg) approach(p,tg,T);
  }
});

// 2. 어깨동무 렉 개선: 즉시 강제 텔레포트가 아니라 목표 위치를 지정 (이동은 tick에서 부드럽게)
function approach(a,t,T){ 
  const tp=t.g.position,ap=a.g.position;let x,z,ry;
  if(T==='hug'){const r=t.g.rotation.y;x=tp.x+.5*Math.cos(r);z=tp.z-.5*Math.sin(r);ry=r}
  else{let dx=ap.x-tp.x,dz=ap.z-tp.z;const m=Math.hypot(dx,dz)||1;dx/=m;dz/=m;x=tp.x+dx*.8;z=tp.z+dz*.8;ry=Math.atan2(-dx,-dz)}
  
  if(T!=='hug') {
      ap.x=x;ap.z=z;a.g.rotation.y=ry;
  }
  a.tx=x;a.tz=z;a.tr=ry;if(a.id===me)dirty=1;
}

// 3. 도우미도 타겟으로 설정 가능하게 nearest(d) 로직 수정
function nearest(d){
  const L=players[me];let b=null,bd=d;
  for(const id in players){
    if(id===me)continue;const q=players[id];if(q.seat!=null)continue;
    const k=Math.hypot(q.g.position.x-L.g.position.x,q.g.position.z-L.g.position.z);if(k<bd){bd=k;b=q}
  }
  for(const id in helpers){
    const q=helpers[id];
    const k=Math.hypot(q.g.position.x-L.g.position.x,q.g.position.z-L.g.position.z);if(k<bd){bd=k;b=q}
  }
  return b;
}
function tgtAct(t){const L=players[me];if(!L)return;standIf();const q=nearest(3.5);
  if(!q)return toast('근처에 대상이 없어요 (가까이 가세요)');socket.emit('emote',{type:t,target:q.id})}

addEventListener('keydown',e=>{
  if(document.activeElement.tagName==='INPUT'){
    if(e.isComposing||e.keyCode===229){if(e.target.id==='msg'&&(e.key==='Enter'||e.code==='Enter'))pend=1;return}
    if(e.key==='Escape'&&e.target.id==='msg'){$('msg').blur();closeChat();return}
    if(e.key==='Enter'){if(e.target.id==='msg')send();else if(!me)$('go').click()}
    return;
  }
  if(e.key==='Enter'&&me){openChat();e.preventDefault();return}
  if((e.key==='q'||e.key==='Q')&&me){toggleMenu();return}
  if((e.key==='e'||e.key==='E')&&me){toggleOrder();return}
  keys[keyOf(e)]=1;
});

  // ===== 도우미 출입문 (위치/크기는 그대로, 디테일 추가) =====
  box(1,2.1,.02,0x15101f,DOOR_X,1.05,-5.48,{});
  RB(.1,2.2,.12,.02,0x3e2723,DOOR_X-.55,1.1,-5.44);RB(.1,2.2,.12,.02,0x3e2723,DOOR_X+.55,1.1,-5.44);RB(1.2,.1,.12,.02,0x3e2723,DOOR_X,2.15,-5.44);
  door=new THREE.Group();door.position.set(DOOR_X-.5,0,-5.42);scene.add(door);
  door.add(rbm(1,2.1,.06,.015,0x1d1a22,.5,1.05,0),rbm(.7,.5,.02,.01,0x2a2530,.5,.5,.04),rbm(.7,.5,.02,.01,0x2a2530,.5,1.0,.04),
    bx(.42,.72,.02,0x4a90e2,.5,1.55,.04,{emissive:0x2a6ac0,emissiveIntensity:.35,transparent:true,opacity:.85}),
    smoothSp(.04,0xffd740,.88,1.0,.06,{metalness:.8,roughness:.25}),smoothCy(.015,.015,.08,0xffd740,.88,1.0,.04,{metalness:.8},10),bx(.9,.15,.015,0x8d6e63,.5,.1,.04,{metalness:.5}));
  door.children[door.children.length-2].rotation.x=Math.PI/2;
  plaque(1.1,.28,(c,w,h)=>{c.fillStyle='#1b5e20';c.fillRect(0,0,w,h);c.fillStyle='#fff';c.font='500 '+h*.55+'px '+FONT;c.textAlign='center';c.fillText('입구',w/2,h*.7)},DOOR_X,2.45,-5.44,0);

  // ===== 조명 =====
  ball=A(new THREE.Mesh(new THREE.IcosahedronGeometry(.45,2),mat(0xdddddd,{metalness:.6,roughness:.25,emissive:0x777788,emissiveIntensity:.5})));ball.position.set(0,3.5,-3);
  [0xff2bd6,0x2bb0ff,0x9b5cff].forEach(c=>{const l=new THREE.PointLight(c,1.5,10);scene.add(l);lights.push(l)});
  spot=new THREE.SpotLight(0xffffff,0,12,.4,.5);
  spot.position.set(0,3.9,-4.1);
  spot.castShadow = true;
  spot.shadow.mapSize.width = 1024;
  spot.shadow.mapSize.height = 1024;
  scene.add(spot,spot.target);
  laser=A(new THREE.Mesh(new THREE.TorusGeometry(.8,.04,6,20),new THREE.MeshBasicMaterial({color:0x00ff66,wireframe:true})));
  laser.position.set(3.9,2.5,-3.3);laser.rotation.y=-Math.PI/2;
  const fc=document.createElement('canvas');fc.width=fc.height=64;{const c=fc.getContext('2d'),g=c.createRadialGradient(32,32,0,32,32,32);g.addColorStop(0,'rgba(255,255,255,1)');g.addColorStop(.35,'rgba(255,255,255,.55)');g.addColorStop(1,'rgba(255,255,255,0)');c.fillStyle=g;c.fillRect(0,0,64,64)}
  const flT=new THREE.CanvasTexture(fc),flM=DOT.map(c=>new THREE.MeshBasicMaterial({map:flT,color:c,transparent:true,opacity:.85,depthWrite:false,blending:THREE.AdditiveBlending})),fg=new THREE.PlaneGeometry(1,1);
  for(let i=0;i<130;i++){const m=new THREE.Mesh(fg,flM[i%6]);scene.add(m);dots.push({m,a:rnd(0,6.28),e:rnd(-1.1,1.1),s:rnd(.22,.5),k:rnd(.6,1.4),p:rnd(0,6.3)})}
  for(let i=0;i<4;i++){const g=new THREE.Group();g.position.set(-2.4+i*1.6,4.1,-1+(i%2)*3);const c=new THREE.Mesh(new THREE.ConeGeometry(.55,4,20,1,true),new THREE.MeshBasicMaterial({color:DOT[i],transparent:true,opacity:.1,depthWrite:false,blending:THREE.AdditiveBlending,side:THREE.DoubleSide}));c.position.y=-2;g.add(c);scene.add(g);beams.push({g,p:i*1.7})}
  initBills();

  scene.traverse(m=>{if(m.isMesh&&m.castShadow&&m.geometry){m.geometry.computeBoundingSphere();if(m.geometry.boundingSphere.radius<.45)m.castShadow=false}});
  const renderScene = new THREE.RenderPass(scene, camera);
  const bloomPass = new THREE.UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.3, 0.35, 0.82);
  composer = new THREE.EffectComposer(renderer);
  composer.addPass(renderScene);
  composer.addPass(bloomPass);
}

let lastFilter='';
function tick(){
  requestAnimationFrame(tick);
  const dt=Math.min(clock.getDelta(),.1),t=clock.elapsedTime,L=players[me];
  let ix=(keys.d?1:0)-(keys.a?1:0)+jv.x,iy=(keys.w?1:0)-(keys.s?1:0)-jv.y;
  const mag=Math.hypot(ix,iy),moving=mag>.15;
  
  if(L&&moving){
    if(L.seat!=null)standUp(L,true);
    if(L.at>0&&(L.act==='dance'||L.act==='hug')){L.at=0;socket.emit('emote',{type:'stop'})}
    if(mag>1){ix/=mag;iy/=mag}
    const spd=Math.min(1,mag),cs=Math.cos(yaw),sn=Math.sin(yaw);
    let dx=ix*cs-iy*sn,dz=-ix*sn-iy*cs;const g=L.g;
    if(L.dv>=3.5){const a=Math.sin(t*2.1)*L.dv*.07,c=Math.cos(a),s=Math.sin(a);const ex=dx*c-dz*s;dz=dx*s+dz*c;dx=ex}
    const nx=clamp(g.position.x+dx*3.2*spd*dt,-3.6,3.6),nz=clamp(g.position.z+dz*3.2*spd*dt,-5.2,5.2);
    if(!blocked(nx,g.position.z))g.position.x=nx;
    if(!blocked(g.position.x,nz))g.position.z=nz;
    g.rotation.y=Math.atan2(dx,dz);dirty=1;
  }

  const hugger=id=>{for(const k in players){const q=players[k];if(q.at>0&&q.act==='hug'&&q.tgt===id)return q}return null};

  sendT+=dt;
  if(L&&dirty&&sendT>.06){
      sendT=0;
      if(!moving&&!(L.at>0&&L.act==='hug'))dirty=0;
      socket.emit('move',{x:L.g.position.x,z:L.g.position.z,ry:L.g.rotation.y})
  }

  for(const id in players){
    const p=players[id],g=p.g;let w=moving&&id===me;
    
    // 6. 어깨동무 중일 때 즉시 텔레포트 대신 부드러운 위치/회전값 계산(Lerp 적용)
    if(p.at>0 && p.act==='hug'){
        const tg=players[p.tgt] || helpers[p.tgt];
        if(!tg && id===me) p.at=0;
        else if(tg) {
            const r = tg.g.rotation.y;
            p.tx = tg.g.position.x + 0.5 * Math.cos(r);
            p.tz = tg.g.position.z - 0.5 * Math.sin(r);
            p.tr = r;
            if(id===me) dirty = 1;
        }
    }

    if(id!==me || (id===me && p.at>0 && p.act==='hug')){
      const k=Math.min(1,dt*10),ex=p.tx-g.position.x,ez=p.tz-g.position.z;
      g.position.x+=ex*k;g.position.z+=ez*k;
      const angleDiff = p.tr - g.rotation.y;
      g.rotation.y+=Math.atan2(Math.sin(angleDiff), Math.cos(angleDiff)) * k;
      if(id!==me) w=Math.hypot(ex,ez)>.05;
    }
    
    const sit=p.seat!=null;
    p.dv+=(p.drunk-p.dv)*Math.min(1,dt*.7);
    p.head.material.color.setHex(SKIN).lerp(RED,Math.min(.75,p.dv/7));
    const s=(w&&!sit)?Math.sin(t*10)*.7:0;
    p.bounce=Math.max(0,p.bounce-dt);
    if(p.at>0)p.at-=dt;
    if(p.hit>0)p.hit-=dt;
    const a=p.at>0?p.act:'';
    p.cig.visible=a==='smoke';p.glass.visible=a==='drink'||a==='recv';p.wglass.visible=a==='water';
    p.bottle.visible=p.glassL.visible=a==='pour';p.bcig.visible=a==='burn';
    
    // 책상 위로 올라가는 로직 적용 (테이블 좌표 X: -0.85 ~ 0.85, Z: -1.4 ~ 2.8)
    const onTable = g.position.x > -0.85 && g.position.x < 0.85 && g.position.z > -1.4 && g.position.z < 2.8;
    let y=sit?SEATS[p.seat].y-.5:0;
    if(onTable && !sit) y += 0.64; 
    
    let sw=Math.sin(t*1.7+p.ph)*p.dv*.014;
    let lL=sit?-1.5:s,lR=sit?-1.5:-s;
    let aLx=sit?-.5:-s*.8,aLz=0,aRx=sit?-.5:s*.8,aRz=0,pourTilt=0,lean=0;
    
    // 7. 만취(취기 6 이상) 시 네발로 기어다니는 모션 
    const isCrawling = p.dv >= 6 && !sit;

    if(p.bounce>0){aLx=aRx=0;aLz=-2.4;aRz=2.4;y+=Math.abs(Math.sin(t*14))*.25}
    else if(a==='pour'){
      // 왼손: 잔을 앞에 들고 / 오른손: 병을 위로 들어 기울여서 따름
      const u=(4-p.at)/4,K=clamp(u/.15,0,1)*(1-clamp((u-.9)/.1,0,1));
      aLx=-1.5*K;aLz=.55*K;aRx=-1.9*K;aRz=-.55*K;
      const ph=u<.75?.3+2.2*clamp((u-.2)/.25,0,1):2.5-2.2*clamp((u-.75)/.2,0,1);
      pourTilt=ph*K;
      if(ph>1.9&&u>.38&&u<.8){p.pt-=dt;if(p.pt<=0){p.pt=.04;tmpV.set(0,0,.29);p.bottle.localToWorld(tmpV);burst(tmpV,0xf0d890,1,.12,9)}}
    }
    else if(a==='recv'){
      // 두 손으로 잔을 받치고 살짝 고개 숙여 인사하며 술을 받는 자세
      const u=(4-p.at)/4,K=clamp(u/.15,0,1)*(1-clamp((u-.9)/.1,0,1));
      aRx=-1.35*K;aRz=-.3*K;aLx=-1.0*K;aLz=1.0*K;lean=.14*K*(1+Math.sin(t*3)*.15);
    }
    else if(a==='cash'){
      // 양손을 번갈아 위로 뿌리며 돈을 날림
      const k=Math.sin(t*9);aLx=aRx=0;aLz=-2.5+k*.45;aRz=2.5-k*.45;y+=Math.abs(k)*.05;
      p.pt-=dt;if(p.pt<=0){p.pt=.045;throwBill(p)}
    }
    else if(a==='drink'||a==='water'){aLx=0;aRx=-2.5+Math.sin(t*6)*.12}
    else if(a==='smoke'){
      // 5번 반복: 손을 입으로(빨기) → 내리고 → 입에서 연기 내뿜기
      const f=((11-p.at)/2.2)%1,S=p.gender==='f'?[-2.62,-.58]:[-2.51,-.8];
      let k=0;if(f<.2)k=f/.2;else if(f<.45)k=1;else if(f<.65)k=1-(f-.45)/.2;
      k=k*k*(3-2*k);aLx=0;aRx=S[0]*k;aRz=S[1]*k;
      if(f>=.5&&f<.95){p.pt-=dt;if(p.pt<=0){p.pt=.07;
        p.head.getWorldPosition(tmpV);const fx=Math.sin(g.rotation.y),fz=Math.cos(g.rotation.y);
        tmpV.x+=fx*.18;tmpV.y-=.06;tmpV.z+=fz*.18;puff(tmpV,fx*.35+rnd(-.1,.1),fz*.35+rnd(-.1,.1))}}
    }
    else if(a==='dance'){
      const m=Math.floor(t/1.6)%3,k=Math.sin(t*8);
      y+=Math.abs(k)*.1;sw+=Math.sin(t*4)*.12;lL=k*.6;lR=-k*.6;
      if(m===0){aLx=aRx=0;aLz=-2.5+k*.5;aRz=2.5-k*.5}
      else if(m===1){aRx=0;aRz=2.6+k*.3;aLx=k*.8;aLz=-.2}
      else{aLx=-1.2+k*.8;aRx=-1.2-k*.8}
    }
    else if(a==='hug'){aLx=0;aLz=-1.35}
    else if(a==='slap'||a==='burn'){
      const tp=players[p.tgt] || helpers[p.tgt];
      if(tp){const q=tp.g.position;g.rotation.y=Math.atan2(q.x-g.position.x,q.z-g.position.z)}
      if(a==='slap'){
        const u=(.9-p.at)/.9;aLx=0;
        if(u<.35){const k=u/.35;aRx=-2.6*k;aRz=.5*k}
        else if(u<.55){const k=(u-.35)/.2;aRx=-2.6+1.4*k;aRz=.5-.8*k}
        else{const k=Math.min(1,(u-.55)/.45);aRx=-1.2*(1-k);aRz=-.3*(1-k)}
        if(u>=.45&&!p.fx){p.fx=1;impact(p,'slap')}
      }else{
        const u=(1.6-p.at)/1.6;aLx=0;
        aRx=-1.5*(u<.7?Math.min(1,u/.35):Math.max(0,1-(u-.7)/.3));
        if(u>=.5&&!p.fx){p.fx=1;impact(p,'burn')}
      }
    }
    
    // 네발로 걷기: 몸통만 눕히고(rig) 이름표는 그대로 / 손발이 바닥을 짚도록 보정
    let rigX=lean,rigY=0,rigZ=0;
    if(isCrawling){
      const TH=1.45,cw=w?Math.sin(t*10)*.45:0;
      rigX=TH;rigY=.5;rigZ=-.7;aLz=aRz=0;
      aLx=-TH+cw;aRx=-TH-cw;lL=-TH-cw*.8;lR=-TH+cw*.8;
    }
    p.rig.rotation.x=rigX;p.rig.position.set(0,rigY,rigZ);

    const hb=hugger(id);
    if(hb&&!a&&p.bounce<=0){aRx=0;aRz=1.35}
    if(p.hit>0){
      if(p.hitType==='slap')sw+=Math.sin(p.hit*22)*p.hit*.5;
      else{y+=Math.sin(p.hit/.7*Math.PI)*.3;aRx=-1+Math.sin(t*35)*.5;aRz=0}
    }
    p.legL.rotation.x=lL;p.legR.rotation.x=lR;
    p.armL.rotation.set(aLx,0,aLz);p.armR.rotation.set(aRx,0,aRz);p.bottle.rotation.x=pourTilt;
    g.position.y=y;g.rotation.z=sw;
    if(p.bub){p.bt-=dt;if(p.bt<=0){g.remove(p.bub);p.bub=null}}
  }
  
  const dvL=L?L.dv:0;
  if(L){const p=L.g.position,cp=Math.cos(pitch);
    tmpC.set(clamp(p.x+Math.sin(yaw)*cp*dist,-3.7,3.7),clamp(.9+Math.sin(pitch)*dist,.5,4),clamp(p.z+Math.cos(yaw)*cp*dist,-5.2,5.2));
    camera.position.lerp(tmpC,Math.min(1,dt*10));
    // 네발로 기어다닐 때 시선이 땅에 파묻히지 않도록 카메라 타겟 y값 유지
    camera.lookAt(p.x, L.dv >= 6 && L.seat == null ? 0.3 : 0.9, p.z); 
    if(dvL>.2){camera.rotateZ(Math.sin(t*1.3)*dvL*.012);camera.fov=65+Math.sin(t*1.1)*dvL*.9;camera.updateProjectionMatrix()}
    else if(camera.fov!==65){camera.fov=65;camera.updateProjectionMatrix()}}
  const fl=dvL>=2?'blur('+((dvL-1.5)*.2).toFixed(2)+'px) saturate('+(1+dvL*.08).toFixed(2)+') hue-rotate('+(Math.sin(t*.7)*dvL*3).toFixed(1)+'deg)':'';
  if(fl!==lastFilter){renderer.domElement.style.filter=fl;lastFilter=fl}
  $('vig').style.opacity=dvL>=2?Math.min(1,dvL/8)*(.7+Math.sin(t*1.5)*.3):0;
  const holder=micId&&players[micId];
  if(holder){const p=holder.g.position;spot.intensity=2.5;spot.position.set(p.x,3.9,p.z+.01);spot.target.position.copy(p)}
  else spot.intensity=0;
  ball.rotation.y+=dt*.8;laser.rotation.z+=dt*.8;
  if(fanBlades){fanBlades.rotation.z+=dt*16;fanHead.rotation.y=Math.sin(t*.4)*.7}
  for(const k in tItems){const it=tItems[k],ag=t-it.t0;it.g.position.y=.64+(ag<.45?.5*(1-ag/.45)*(1-ag/.45):0)}
  {const bt=spendMap[me]||0;billShown+=(bt-billShown)*Math.min(1,dt*6);if(Math.abs(bt-billShown)<1)billShown=bt;
   billShownR+=(roomTotal-billShownR)*Math.min(1,dt*6);if(Math.abs(roomTotal-billShownR)<1)billShownR=roomTotal;
   const a=won(billShown),b='룸 합계 '+won(billShownR);if(a!==lastBill){$('billMe').textContent=a;lastBill=a}if(b!==lastBillR){$('billRoom').textContent=b;lastBillR=b}}
  updateBills(dt,t);
  lights.forEach((l,i)=>l.position.set(Math.cos(t*.8+i*2.1)*3,3.2,Math.sin(t*.8+i*2.1)*4-1));
  dots.forEach(d=>placeDot(d,t));
  beams.forEach(b=>{b.g.rotation.x=Math.sin(t*.9+b.p)*.7;b.g.rotation.z=Math.cos(t*.7+b.p*1.3)*.7});
  
  for(const id in helpers){
    const h=helpers[id],g=h.g;let walking=false;
    if(h.delay>0){h.delay-=dt;doorT=Math.max(doorT,1.2);if(h.delay<=0)g.visible=true;continue}
    if(h.wp.length){
      const [wx,wz]=h.wp[0],dx=wx-g.position.x,dz=wz-g.position.z,d=Math.hypot(dx,dz),st=1.7*dt;
      walking=true;
      if(d<=st){g.position.x=wx;g.position.z=wz;h.wp.shift()}
      else{g.position.x+=dx/d*st;g.position.z+=dz/d*st;g.rotation.y=Math.atan2(dx,dz)}
      if(!h.wp.length){
        if(h.state==='out'){scene.remove(g);delete helpers[id];doorT=Math.max(doorT,.8);continue}
        h.state='idle';g.rotation.y=Math.PI;walking=false;
      }
    }
    if(Math.hypot(g.position.x-DOOR_X,g.position.z-DOOR_Z)<3.2)doorT=Math.max(doorT,.5);
    const s=walking?Math.sin(t*10)*.7:0;
    
    // 타격 애니메이션 처리 (도우미도 유저처럼 흔들리게)
    let y = 0;
    let aRx = walking ? s*.8 : h.gender==='f' ? 2.4+Math.sin(t*14)*.25 : -1.2+Math.sin(t*5+h.ph)*.5;
    let aRz = 0;
    let sw = 0;

    if(h.hit>0){
      h.hit-=dt;
      if(h.hitType==='slap') sw+=Math.sin(h.hit*22)*h.hit*.5;
      else { y+=Math.sin(h.hit/.7*Math.PI)*.3; aRx=-1+Math.sin(t*35)*.5; aRz=0; }
    }

    h.legL.rotation.x=s;h.legR.rotation.x=-s;
    if(walking){h.armL.rotation.set(-s*.8,0,h.gender==='f'?-.25:0);h.armR.rotation.set(aRx,0,aRz);g.position.y=y}
    else if(h.gender==='f'){
      g.position.y=y + Math.abs(Math.sin(t*6+h.ph))*.08;g.rotation.y=Math.PI+Math.sin(t*3+h.ph)*.35;
      h.armL.rotation.set(0,0,-.25);h.armR.rotation.set(0,0,aRx);h.tb.rotation.z=Math.sin(t*20)*.5;
    }else{
      g.position.y=y + Math.abs(Math.sin(t*5+h.ph))*.06;g.rotation.y=Math.PI+Math.sin(t*2.5+h.ph)*.3;
      h.armL.rotation.set(Math.sin(t*5+h.ph)*.5,0,-.15);h.armR.rotation.set(aRx,0,.1);
    }
    g.rotation.z = sw;

    if(h.bub){h.bt-=dt;if(h.bt<=0){g.remove(h.bub);h.bub=null}}
  }
  doorT=Math.max(0,doorT-dt);
  door.rotation.y+=((doorT>0?-1.75:0)-door.rotation.y)*Math.min(1,dt*5);
  for(let i=puffs.length-1;i>=0;i--){const u=puffs[i];u.t+=dt;u.m.position.y+=dt*.4;u.m.position.x+=dt*u.vx;u.m.position.z+=dt*u.vz;u.vx*=1-dt*1.2;u.vz*=1-dt*1.2;
    const k=1+u.t*2;u.m.scale.set(k,k,k);u.m.material.opacity=Math.max(0,.55-u.t*.28);
    if(u.t>2){scene.remove(u.m);u.m.material.dispose();puffs.splice(i,1)}}
  for(let i=parts.length-1;i>=0;i--){const u=parts[i];u.t+=dt;u.vy-=u.g*dt;
    u.m.position.x+=u.vx*dt;u.m.position.y=Math.max(.02,u.m.position.y+u.vy*dt);u.m.position.z+=u.vz*dt;
    u.m.material.opacity=Math.max(0,1-u.t/u.life);
    if(u.t>u.life){scene.remove(u.m);u.m.material.dispose();parts.splice(i,1)}}
  
  if(composer) composer.render();
  else renderer.render(scene,camera);
}
