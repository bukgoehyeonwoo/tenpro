<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>노래방 만남의 광장</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#0b0618;font-family:system-ui,sans-serif;color:#fff}
canvas{display:block}
#join{position:fixed;inset:0;display:flex;flex-direction:column;gap:10px;align-items:center;justify-content:center;background:#0b0618ee;z-index:5}
#join h1{margin:0 0 8px;font-size:28px;text-shadow:0 0 14px #f0f}
input,button{font:inherit;padding:10px 14px;border-radius:10px;border:0}
input{background:#fff2;color:#fff;width:220px}
button{background:#e040fb;color:#fff;cursor:pointer}
#err{color:#ff8a8a;min-height:1em}
#top{position:fixed;top:8px;left:10px;font-size:13px;text-shadow:0 1px 3px #000;display:none}
#ui{position:fixed;left:0;right:0;bottom:0;padding:10px;display:none;flex-direction:column;gap:8px;pointer-events:none}
#log{font-size:14px;text-shadow:0 1px 3px #000}
#bar,#chat{display:flex;gap:6px;pointer-events:auto;flex-wrap:wrap}
#chat input{flex:1;min-width:0}
#help{background:#ff4081}
#pad{position:fixed;right:10px;bottom:130px;display:none;grid-template-columns:repeat(3,48px);gap:4px}
#pad button{padding:12px 0;background:#fff3}
#pad [data-k=w]{grid-column:2}
#pad [data-k=a]{grid-row:2;grid-column:1}
#pad [data-k=s]{grid-row:2;grid-column:2}
#pad [data-k=d]{grid-row:2;grid-column:3}
</style></head><body>
<div id="join"><h1>🎤 노래방 만남의 광장</h1>
<input id="name" placeholder="닉네임" maxlength="10">
<input id="room" placeholder="방 코드 (친구랑 똑같이!)" maxlength="20">
<button id="go">입장하기</button><div id="err"></div>
<div style="font-size:12px;opacity:.7">이동 WASD/방향키 · Enter로 채팅 · 방당 최대 6명</div></div>
<div id="top"></div>
<div id="pad"><button data-k="w">▲</button><button data-k="a">◀</button><button data-k="s">▼</button><button data-k="d">▶</button></div>
<div id="ui"><div id="log"></div>
<div id="bar"><button id="mic">🎤 마이크</button><button id="clap">👏 박수</button><button id="tmb">🪘 탬버린</button><button id="help">🧚 도우미 부르기</button></div>
<div id="chat"><input id="msg" placeholder="Enter 눌러서 채팅..." maxlength="120"><button id="send">전송</button></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="/socket.io/socket.io.js"></script>
<script>
const $=id=>document.getElementById(id),clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),rnd=(a,b)=>a+Math.random()*(b-a);
const COLORS=[0xff5252,0x40c4ff,0x69f0ae,0xffd740,0xe040fb,0xff9100];
const socket=io();
let me,roomName,players={},helpers=[],micId=null,keys={},scene,camera,renderer,spot,ball,lights=[],clock,screenTimer,sendT=0,dirty=0;
const sc=document.createElement('canvas');sc.width=512;sc.height=256;
const sx=sc.getContext('2d'),stex=new THREE.CanvasTexture(sc);

$('room').value=new URLSearchParams(location.search).get('room')||'';
$('go').onclick=()=>{roomName=$('room').value.trim()||'노래방';socket.emit('join',{name:$('name').value.trim()||'익명',room:roomName})};
socket.on('full',()=>$('err').textContent='방이 꽉 찼어요! (최대 6명)');

function label(text,bg){
  const c=document.createElement('canvas');c.width=512;c.height=96;
  const x=c.getContext('2d');x.font='bold 40px sans-serif';
  const t=text.length>22?text.slice(0,22)+'…':text;
  if(bg){const w=Math.min(500,x.measureText(t).width+40);x.fillStyle=bg;x.beginPath();x.roundRect((512-w)/2,10,w,76,24);x.fill()}
  x.textAlign='center';x.textBaseline='middle';
  if(!bg){x.lineWidth=7;x.strokeStyle='#000';x.strokeText(t,256,48)}
  x.fillStyle='#fff';x.fillText(t,256,48);
  const s=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),transparent:true,depthTest:false}));
  s.scale.set(3.2,.6,1);return s;
}
function showScreen(l1,l2,hue,secs){
  sx.fillStyle=`hsl(${hue},60%,16%)`;sx.fillRect(0,0,512,256);
  sx.fillStyle='#fff';sx.textAlign='center';sx.font='bold 40px sans-serif';sx.fillText(l1,256,105);
  sx.font='bold 66px sans-serif';sx.fillText(l2,256,200);stex.needsUpdate=true;
  clearTimeout(screenTimer);screenTimer=null;
  if(secs)screenTimer=setTimeout(()=>{screenTimer=null;setMic(micId)},secs*1000);
}
function setMic(id){
  micId=id;$('mic').textContent=id===me?'🎤 마이크 내려놓기':'🎤 마이크';
  if(id&&players[id])showScreen(players[id].name+' 열창중','♪ ♫ ♪',300,0);
  else if(!screenTimer)showScreen('🎤 노래방','마이크를 잡아봐!',280,0);
}
function addLog(n,t){const d=document.createElement('div');d.textContent=n+': '+t;const l=$('log');l.appendChild(d);while(l.children.length>6)l.firstChild.remove()}
function updateTop(){$('top').textContent='방 코드: '+roomName+' · '+Object.keys(players).length+'/6명 (주소창 링크를 친구에게 공유!)'}
function bubble(p,text,secs){if(p.bub)p.g.remove(p.bub);p.bub=label(text,'#000a');p.bub.position.y=2.85;p.g.add(p.bub);p.bt=secs}

function add(p){
  const g=new THREE.Group();
  const body=new THREE.Mesh(new THREE.CylinderGeometry(.35,.42,1,12),new THREE.MeshStandardMaterial({color:COLORS[p.color]}));body.position.y=.8;
  const head=new THREE.Mesh(new THREE.SphereGeometry(.3,16,12),new THREE.MeshStandardMaterial({color:0xffe0bd}));head.position.y=1.6;
  const nm=label(p.name);nm.position.y=2.25;
  g.add(body,head,nm);g.position.set(p.x,0,p.z);g.rotation.y=p.ry;scene.add(g);
  players[p.id]={g,name:p.name,tx:p.x,tz:p.z,tr:p.ry,bounce:0,bub:null,bt:0};updateTop();
}
function spawnHelper(){
  const M=(c,e)=>new THREE.MeshStandardMaterial({color:c,emissive:e||0});
  const g=new THREE.Group();
  const b=new THREE.Mesh(new THREE.CylinderGeometry(.35,.5,1.2,12),M(0xff4081,0x550022));b.position.y=.8;
  const h=new THREE.Mesh(new THREE.SphereGeometry(.32,16,12),M(0xffe0bd));h.position.y=1.7;
  const hat=new THREE.Mesh(new THREE.ConeGeometry(.3,.6,12),M(0xffeb3b));hat.position.y=2.2;
  const tb=new THREE.Mesh(new THREE.TorusGeometry(.25,.05,8,16),M(0xffd740));tb.position.set(.6,1.4,.2);
  const l=label('🪘 분위기 띄워드릴게요~','#c2185bcc');l.position.y=2.9;
  g.add(b,h,hat,tb,l);g.position.set(rnd(-3,3),0,rnd(-1,3));scene.add(g);helpers.push({g,tb,t:8});
}

socket.on('init',d=>{
  me=d.id;$('join').style.display='none';$('ui').style.display='flex';$('top').style.display='block';
  if(matchMedia('(pointer:coarse)').matches)$('pad').style.display='grid';
  history.replaceState(null,'','?room='+encodeURIComponent(roomName));
  build();d.players.forEach(add);setMic(d.mic);clock=new THREE.Clock();tick();
});
socket.on('join',p=>{add(p);addLog('📢',p.name+'님 입장!')});
socket.on('leave',id=>{const p=players[id];if(!p)return;scene.remove(p.g);delete players[id];updateTop();addLog('📢',p.name+'님 퇴장')});
socket.on('move',m=>{const p=players[m.id];if(p&&m.id!==me){p.tx=m.x;p.tz=m.z;p.tr=m.ry}});
socket.on('chat',m=>{const p=players[m.id];if(!p)return;addLog(p.name,m.text);bubble(p,m.text,5)});
socket.on('emote',m=>{const p=players[m.id];if(!p)return;p.bounce=2;bubble(p,m.type==='clap'?'👏👏👏':'🪘 짤랑짤랑~',2)});
socket.on('mic',m=>setMic(m.id));
socket.on('score',m=>{const p=players[m.id];if(p)showScreen(p.name+' 점수',m.score+'점!!',50,6)});
socket.on('helper',m=>{const p=players[m.id];addLog('🧚 도우미',(p?p.name:'누군가')+'님이 도우미를 불렀어요!');spawnHelper()});

$('mic').onclick=()=>socket.emit('mic');
$('clap').onclick=()=>socket.emit('emote','clap');
$('tmb').onclick=()=>socket.emit('emote','tmb');
$('help').onclick=()=>socket.emit('helper');
function send(){const v=$('msg').value.trim();if(v)socket.emit('chat',v);$('msg').value='';$('msg').blur()}
$('send').onclick=send;
const keyOf=e=>({arrowup:'w',arrowleft:'a',arrowdown:'s',arrowright:'d'}[e.key.toLowerCase()]||e.key.toLowerCase());
addEventListener('keydown',e=>{
  if(document.activeElement.tagName==='INPUT'){
    if(e.key==='Enter'){if(e.target.id==='msg')send();else if(!me)$('go').click()}
    return;
  }
  if(e.key==='Enter'&&me){$('msg').focus();e.preventDefault();return}
  keys[keyOf(e)]=1;
});
addEventListener('keyup',e=>{delete keys[keyOf(e)]});
document.querySelectorAll('#pad button').forEach(b=>{
  b.onpointerdown=()=>keys[b.dataset.k]=1;
  b.onpointerup=b.onpointerleave=b.onpointercancel=()=>delete keys[b.dataset.k];
});

function build(){
  renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));document.body.prepend(renderer.domElement);
  scene=new THREE.Scene();scene.background=new THREE.Color(0x0b0618);
  camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,.1,60);
  addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
  scene.add(new THREE.AmbientLight(0x8866cc,.9));
  const M=(c,o)=>new THREE.MeshStandardMaterial(Object.assign({color:c},o));
  const box=(w,h,d,c,x,y,z)=>{const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),M(c));m.position.set(x,y,z);scene.add(m);return m};
  const room=new THREE.Mesh(new THREE.BoxGeometry(20,7,16),M(0x2b1a55,{side:THREE.BackSide}));room.position.y=3.5;scene.add(room);
  box(20,.1,16,0x3a2470,0,0,0);
  const st=new THREE.Mesh(new THREE.CylinderGeometry(1.8,1.8,.2,24),M(0x7b1fa2));st.position.set(0,.1,-5);scene.add(st);
  box(.05,1.3,.05,0xcccccc,0,.85,-5);
  const mc=new THREE.Mesh(new THREE.SphereGeometry(.1,12,8),M(0x222222));mc.position.set(0,1.55,-5);scene.add(mc);
  [-4,0,4].forEach(z=>[-1,1].forEach(s=>{
    box(1.4,.8,2.8,0xc2185b,9*s,.4,z);box(.3,1.4,2.8,0xc2185b,9.6*s,.9,z);
  }));
  [-1,1].forEach(s=>box(1.2,.6,2.4,0x4527a0,7*s,.3,0));
  box(8.4,4.4,.1,0x111111,0,3.6,-7.96);
  const scr=new THREE.Mesh(new THREE.PlaneGeometry(8,4),new THREE.MeshBasicMaterial({map:stex}));scr.position.set(0,3.6,-7.9);scene.add(scr);
  ball=new THREE.Mesh(new THREE.IcosahedronGeometry(.7,1),M(0xdddddd,{metalness:.9,roughness:.15,flatShading:true}));ball.position.set(0,6,0);scene.add(ball);
  [0xff00ff,0x00e5ff,0xffee00].forEach(c=>{const l=new THREE.PointLight(c,1.2,16);scene.add(l);lights.push(l)});
  spot=new THREE.SpotLight(0xffffff,0,20,.35,.5);spot.position.set(0,6.5,0);scene.add(spot,spot.target);
}

function tick(){
  requestAnimationFrame(tick);
  const dt=Math.min(clock.getDelta(),.1),t=clock.elapsedTime,L=players[me];
  let dx=(keys.d?1:0)-(keys.a?1:0),dz=(keys.s?1:0)-(keys.w?1:0);
  const moving=dx||dz;
  if(L&&moving){
    const l=Math.hypot(dx,dz);dx/=l;dz/=l;const g=L.g;
    g.position.x=clamp(g.position.x+dx*4*dt,-9.3,9.3);
    g.position.z=clamp(g.position.z+dz*4*dt,-7.3,7.3);
    g.rotation.y=Math.atan2(dx,dz);dirty=1;
  }
  sendT+=dt;
  if(L&&dirty&&sendT>.06){sendT=0;if(!moving)dirty=0;socket.emit('move',{x:L.g.position.x,z:L.g.position.z,ry:L.g.rotation.y})}
  for(const id in players){
    const p=players[id],g=p.g;
    if(id!==me){const k=Math.min(1,dt*10);g.position.x+=(p.tx-g.position.x)*k;g.position.z+=(p.tz-g.position.z)*k;g.rotation.y=p.tr}
    p.bounce=Math.max(0,p.bounce-dt);
    g.position.y=p.bounce>0?Math.abs(Math.sin(t*14))*.35:0;
    if(p.bub){p.bt-=dt;if(p.bt<=0){g.remove(p.bub);p.bub=null}}
  }
  if(L){const p=L.g.position;
    camera.position.lerp(new THREE.Vector3(p.x*.8,4.5,clamp(p.z+6,-7.5,7.6)),Math.min(1,dt*5));
    camera.lookAt(p.x,1,p.z)}
  const holder=micId&&players[micId];
  if(holder){const p=holder.g.position;spot.intensity=2.5;spot.position.set(p.x,6.5,p.z+.01);spot.target.position.copy(p)}
  else spot.intensity=0;
  ball.rotation.y+=dt*.8;
  lights.forEach((l,i)=>l.position.set(Math.cos(t*.8+i*2.1)*7,5,Math.sin(t*.8+i*2.1)*5));
  for(let i=helpers.length-1;i>=0;i--){
    const h=helpers[i];h.t-=dt;h.g.position.y=Math.abs(Math.sin(t*6))*.25;h.tb.rotation.z=Math.sin(t*20)*.5;
    if(h.t<=0){scene.remove(h.g);helpers.splice(i,1)}
  }
  renderer.render(scene,camera);
}
</script></body></html>
